name: VenturaHR V2 Domain

on:
  push:
    branches: [ventura-2.0]
    paths:
      - 'packages/ventura_domain/**'
      - '.github/workflows/domain-v2.yml'
  pull_request:
    paths:
      - 'packages/ventura_domain/**'
      - '.github/workflows/domain-v2.yml'

jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ventura_domain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Format
        run: dart format .

      - name: Verify formatting
        run: git diff --exit-code -- .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test
